    <rect x="14" y="132" width="102" height="10" rx="4" fill="#E3E8EF"/>
    <rect x="14" y="150" width="82" height="10" rx="4" fill="#E3E8EF"/>
    <rect x="14" y="168" width="94" height="10" rx="4" fill="#E3E8EF"/>
    <rect x="14" y="192" width="102" height="26" rx="8" fill="#102A56"/>
    <rect x="44" y="201" width="42" height="8" rx="4" fill="#FFFFFF" opacity="0.85"/>
    <rect x="14" y="226" width="30" height="6" rx="3" fill="#102A56" opacity="0.2"/>
