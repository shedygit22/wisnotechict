<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="plGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0A1930"/>
    </linearGradient>
    <filter id="plShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="#FFFFFF"/>
  <rect x="0" y="0" width="800" height="500" rx="16" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1"/>
  <!-- Student 1 coding -->
  <g transform="translate(120, 80)" filter="url(#plShadow)">
    <rect x="0" y="0" width="260" height="340" rx="12" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="120" rx="12" fill="#E3E8EF"/>
    <circle cx="130" cy="60" r="30" fill="#FFFFFF" stroke="#102A56" stroke-width="2"/>
    <rect x="100" y="100" width="60" height="60" rx="4" fill="#102A56" opacity="0.15"/>
    <rect x="100" y="100" width="40" height="40" rx="2" fill="#102A56" opacity="0.3"/>
    <text x="130" y="180" font-family="Arial" font-size="12" fill="#344054" text-anchor="center">Student</text>
    <rect x="20" y="220" width="220" height="60" rx="6" fill="#F1F5F9"/>
    <rect x="20" y="220" width="220" height="8" rx="2" fill="#102A56"/>
    <rect x="20" y="238" width="100" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="20" y="256" width="120" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="20" y="274" width="90" height="8" rx="2" fill="#E3E8EF"/>
  </g>
  <!-- Student 2 designing -->
  <g transform="translate(420, 80)" filter="url(#plShadow)">
    <rect x="0" y="0" width="260" height="340" rx="12" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="120" rx="12" fill="#E3E8EF"/>
    <circle cx="130" cy="60" r="30" fill="#FFFFFF" stroke="#102A56" stroke-width="2"/>
    <rect x="40" y="100" width="180" height="120" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="60" y="120" width="140" height="80" rx="4" fill="#102A56" opacity="0.1"/>
    <rect x="60" y="120" width="100" height="80" rx="4" fill="#102A56" opacity="0.2"/>
    <text x="130" y="270" font-family="Arial" font-size="12" fill="#344054" text-anchor="center">Designer</text>
    <rect x="20" y="300" width="220" height="40" rx="6" fill="#F1F5F9"/>
    <rect x="20" y="300" width="120" height="8" rx="2" fill="#102A56"/>
    <rect x="20" y="318" width="100" height="8" rx="2" fill="#E3E8EF"/>
  </g>
  <!-- Projects badge -->
  <g transform="translate(300, 420)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#102A56"/>
    <rect x="20" y="14" width="28" height="32" rx="4" fill="#FFFFFF"/>
    <rect x="56" y="14" width="16" height="24" rx="2" fill="#FFFFFF"/>
    <text x="110" y="26" font-family="Arial" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Portfolio</text>
    <text x="110" y="42" font-family="Arial" font-size="11" fill="#E3E8EF" text-anchor="middle">Real Projects</text>
  </g>
  <!-- Certificate -->
  <g transform="translate(520, 400)">
    <rect x="0" y="0" width="100" height="70" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="0" y="0" width="100" height="16" rx="4" fill="#102A56"/>
    <rect x="10" y="22" width="80" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="10" y="34" width="60" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="10" y="46" width="70" height="8" rx="2" fill="#E3E8EF"/>
  </g>
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Practical Learning &bull; Real Projects &bull; Portfolio Development</text>
</svg>
