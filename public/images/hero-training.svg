<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0A1930"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="#F5F7FA"/>
  <!-- Decorative grid -->
  <path d="M0 0 L1200 0 L1200 700 L0 700 Z" fill="url(#heroGrad)" opacity="0.95"/>
  <rect x="60" y="60" width="1080" height="580" rx="32" fill="#FFFFFF" opacity="0.12" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Laptop illustration -->
  <g transform="translate(700, 180)">
    <rect x="0" y="100" width="340" height="260" rx="8" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect x="20" y="120" width="300" height="220" rx="6" fill="#0A1930"/>
    <!-- Screen content -->
    <rect x="40" y="140" width="120" height="8" rx="2" fill="#102A56"/>
    <rect x="40" y="156" width="200" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="40" y="172" width="100" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="40" y="188" width="180" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="40" y="204" width="90" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="40" y="220" width="220" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="40" y="236" width="140" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="40" y="252" width="260" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="40" y="268" width="110" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="40" y="284" width="240" height="8" rx="2" fill="#E3E8EF"/>
    <!-- Keyboard -->
    <rect x="30" y="340" width="280" height="20" rx="4" fill="#E3E8EF"/>
  </g>
  <!-- Person icon (learning) -->
  <g transform="translate(180, 420)">
    <circle cx="50" cy="50" r="40" fill="#FFFFFF" stroke="#102A56" stroke-width="3"/>
    <path d="M20 100 L80 100 L80 140 L20 140 Z" fill="#FFFFFF" stroke="#102A56" stroke-width="3"/>
    <rect x="35" y="100" width="30" height="35" rx="4" fill="#FFFFFF"/>
  </g>
  <!-- Book/graduation cap -->
  <g transform="translate(40, 40)">
    <path d="M30 60 L90 60 L60 20 Z" fill="#102A56"/>
    <rect x="25" y="60" width="70" height="8" rx="2" fill="#0A1930"/>
    <rect x="30" y="72" width="60" height="8" rx="2" fill="#0A1930"/>
    <rect x="35" y="84" width="50" height="8" rx="2" fill="#0A1930"/>
  </g>
  <!-- Brand text -->
  <text x="600" y="660" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle">Wisnotech Academy &bull; Practical Technology Training</text>
</svg>
