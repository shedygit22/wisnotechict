<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="dmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0A1930"/>
    </linearGradient>
    <filter id="dmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="350" fill="#FFFFFF"/>
  <rect x="0" y="0" width="600" height="350" rx="12" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1"/>
  <!-- Social media dashboard -->
  <g transform="translate(60, 50)" filter="url(#dmShadow)">
    <rect x="0" y="0" width="480" height="240" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
    <!-- Header -->
    <rect x="20" y="20" width="440" height="30" rx="4" fill="#102A56"/>
    <rect x="40" y="28" width="100" height="14" rx="2" fill="#FFFFFF" opacity="0.2"/>
    <!-- Posts grid -->
    <rect x="20" y="60" width="140" height="120" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="40" y="80" width="100" height="80" rx="4" fill="#E3E8EF"/>
    <rect x="40" y="170" width="100" height="10" rx="2" fill="#E3E8EF" opacity="0.5"/>
    <rect x="170" y="60" width="140" height="120" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="190" y="80" width="100" height="80" rx="4" fill="#E3E8EF"/>
    <rect x="190" y="170" width="100" height="10" rx="2" fill="#E3E8EF" opacity="0.5"/>
    <rect x="320" y="60" width="140" height="120" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="340" y="80" width="100" height="80" rx="4" fill="#E3E8EF"/>
    <rect x="340" y="170" width="100" height="10" rx="2" fill="#E3E8EF" opacity="0.5"/>
  </g>
  <!-- Graph chart -->
  <g transform="translate(60, 210)">
    <rect x="0" y="0" width="80" height="80" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="10" y="10" width="12" height="40" rx="2" fill="#102A56"/>
    <rect x="26" y="30" width="12" height="20" rx="2" fill="#102A56"/>
    <rect x="42" y="20" width="12" height="30" rx="2" fill="#102A56"/>
    <rect x="58" y="10" width="12" height="50" rx="2" fill="#102A56"/>
  </g>
  <g transform="translate(160, 210)">
    <rect x="0" y="0" width="80" height="80" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <circle cx="40" cy="40" r="16" fill="#102A56" opacity="0.15"/>
    <circle cx="40" cy="40" r="10" fill="#102A56" opacity="0.3"/>
    <circle cx="40" cy="40" r="4" fill="#102A56"/>
  </g>
  <g transform="translate(260, 210)">
    <rect x="0" y="0" width="80" height="80" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="20" y="20" width="10" height="10" rx="2" fill="#102A56"/>
    <rect x="40" y="20" width="10" height="10" rx="2" fill="#102A56"/>
    <rect x="60" y="20" width="10" height="10" rx="2" fill="#102A56"/>
    <rect x="20" y="40" width="10" height="10" rx="2" fill="#102A56"/>
    <rect x="40" y="40" width="10" height="10" rx="2" fill="#102A56"/>
    <rect x="60" y="40" width="10" height="10" rx="2" fill="#102A56"/>
  </g>
  <g transform="translate(360, 210)">
    <rect x="0" y="0" width="80" height="80" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <path d="M20 70 L40 30 L60 70" stroke="#102A56" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Digital Marketing &amp; Social Media</text>
</svg>
