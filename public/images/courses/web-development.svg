<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="wdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0A1930"/>
    </linearGradient>
    <filter id="wdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="350" fill="#FFFFFF"/>
  <rect x="0" y="0" width="600" height="350" rx="12" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1"/>
  <!-- Browser window -->
  <g transform="translate(120, 40)" filter="url(#wdShadow)">
    <rect x="0" y="0" width="360" height="230" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="34" rx="10" fill="#102A56"/>
    <rect x="12" y="8" width="14" height="14" rx="3" fill="#EF4444"/>
    <rect x="34" y="8" width="14" height="14" rx="3" fill="#F59E0B"/>
    <rect x="56" y="8" width="14" height="14" rx="3" fill="#10B981"/>
    <!-- Code content -->
    <text x="24" y="62" font-family="monospace" font-size="13" fill="#344054">&lt;!DOCTYPE html&gt;</text>
    <text x="24" y="80" font-family="monospace" font-size="13" fill="#344054">&lt;html lang="en"&gt;</text>
    <text x="40" y="98" font-family="monospace" font-size="13" fill="#102A56">&lt;head&gt;</text>
    <text x="56" y="116" font-family="monospace" font-size="13" fill="#0A1930">&lt;title&gt;Wisnotech&lt;/title&gt;</text>
    <text x="40" y="134" font-family="monospace" font-size="13" fill="#102A56">&lt;/head&gt;</text>
    <text x="40" y="152" font-family="monospace" font-size="13" fill="#102A56">&lt;body&gt;</text>
    <text x="56" y="170" font-family="monospace" font-size="13" fill="#DC2626">&lt;h1&gt;Learn Web Dev&lt;/h1&gt;</text>
    <text x="56" y="188" font-family="monospace" font-size="13" fill="#0A1930">&lt;p&gt;Build smarter systems.&lt;/p&gt;</text>
    <text x="40" y="206" font-family="monospace" font-size="13" fill="#102A56">&lt;/body&gt;</text>
    <text x="24" y="224" font-family="monospace" font-size="13" fill="#344054">&lt;/html&gt;</text>
    <rect x="24" y="238" width="180" height="6" rx="2" fill="#E3E8EF"/>
  </g>
  <!-- Code brackets -->
  <g transform="translate(470, 120)">
    <path d="M0 40 L40 0 L40 80 L0 40 Z" fill="#102A56"/>
    <text x="20" y="100" font-family="Arial" font-size="16" fill="#0A1930" text-anchor="middle" font-weight="bold">&lt;/&gt;</text>
  </g>
  <!-- Device icons -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="70" height="70" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="10" y="10" width="50" height="50" rx="4" fill="#102A56" opacity="0.1"/>
    <circle cx="35" cy="35" r="6" fill="#102A56" opacity="0.2"/>
  </g>
  <g transform="translate(130, 260)">
    <rect x="0" y="0" width="70" height="70" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="10" y="10" width="50" height="50" rx="4" fill="#102A56" opacity="0.1"/>
    <rect x="25" y="25" width="20" height="20" rx="2" fill="#102A56" opacity="0.2"/>
  </g>
  <g transform="translate(220, 260)">
    <rect x="0" y="0" width="70" height="70" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="10" y="10" width="50" height="50" rx="4" fill="#102A56" opacity="0.1"/>
    <circle cx="35" cy="35" r="10" fill="#102A56" opacity="0.2"/>
  </g>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Web Design &amp; Development</text>
</svg>
