<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="datGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0A1930"/>
    </linearGradient>
    <filter id="datShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="350" fill="#FFFFFF"/>
  <rect x="0" y="0" width="600" height="350" rx="12" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1"/>
  <!-- Database -->
  <g transform="translate(60, 50)" filter="url(#datShadow)">
    <ellipse cx="180" cy="40" rx="140" ry="20" fill="#102A56" opacity="0.15" stroke="#102A56" stroke-width="1"/>
    <ellipse cx="180" cy="100" rx="140" ry="20" fill="#102A56" opacity="0.1" stroke="#102A56" stroke-width="1"/>
    <ellipse cx="180" cy="160" rx="140" ry="20" fill="#102A56" opacity="0.08" stroke="#102A56" stroke-width="1"/>
    <line x1="40" y1="40" x2="40" y2="160" stroke="#102A56" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="320" y1="40" x2="320" y2="160" stroke="#102A56" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Data rows -->
    <rect x="80" y="30" width="60" height="12" rx="2" fill="#102A56" opacity="0.2"/>
    <rect x="200" y="30" width="60" height="12" rx="2" fill="#102A56" opacity="0.2"/>
    <rect x="320" y="30" width="40" height="12" rx="2" fill="#102A56" opacity="0.2"/>
    <rect x="80" y="90" width="80" height="12" rx="2" fill="#102A56" opacity="0.2"/>
    <rect x="220" y="90" width="60" height="12" rx="2" fill="#102A56" opacity="0.2"/>
    <rect x="300" y="90" width="40" height="12" rx="2" fill="#102A56" opacity="0.2"/>
    <rect x="80" y="150" width="100" height="12" rx="2" fill="#102A56" opacity="0.2"/>
    <rect x="240" y="150" width="80" height="12" rx="2" fill="#102A56" opacity="0.2"/>
    <rect x="340" y="150" width="20" height="12" rx="2" fill="#102A56" opacity="0.2"/>
  </g>
  <!-- Spreadsheet -->
  <g transform="translate(300, 50)">
    <rect x="0" y="0" width="160" height="160" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="20" rx="6" fill="#102A56"/>
    <rect x="8" y="28" width="48" height="24" rx="2" fill="#E3E8EF"/>
    <rect x="64" y="28" width="48" height="24" rx="2" fill="#E3E8EF"/>
    <rect x="104" y="28" width="48" height="24" rx="2" fill="#E3E8EF"/>
    <rect x="8" y="60" width="48" height="24" rx="2" fill="#E3E8EF"/>
    <rect x="64" y="60" width="48" height="24" rx="2" fill="#E3E8EF"/>
    <rect x="104" y="60" width="48" height="24" rx="2" fill="#E3E8EF"/>
    <rect x="8" y="92" width="48" height="24" rx="2" fill="#E3E8EF"/>
    <rect x="64" y="92" width="48" height="24" rx="2" fill="#E3E8EF"/>
    <rect x="104" y="92" width="48" height="24" rx="2" fill="#E3E8EF"/>
    <rect x="8" y="124" width="48" height="24" rx="2" fill="#E3E8EF"/>
    <rect x="64" y="124" width="48" height="24" rx="2" fill="#E3E8EF"/>
    <rect x="104" y="124" width="48" height="24" rx="2" fill="#E3E8EF"/>
  </g>
  <!-- Chart -->
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="160" height="90" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="20" y="20" width="20" height="50" rx="2" fill="#102A56"/>
    <rect x="50" y="50" width="20" height="20" rx="2" fill="#102A56" opacity="0.6"/>
    <rect x="80" y="30" width="20" height="40" rx="2" fill="#102A56"/>
    <rect x="110" y="40" width="20" height="30" rx="2" fill="#102A56"/>
    <rect x="140" y="10" width="20" height="60" rx="2" fill="#102A56"/>
  </g>
  <!-- Filter -->
  <g transform="translate(240, 220)">
    <rect x="0" y="0" width="120" height="90" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <path d="M60 20 L40 40 L80 40 Z" fill="#102A56"/>
    <rect x="40" y="40" width="20" height="10" rx="2" fill="#102A56"/>
    <rect x="30" y="60" width="40" height="20" rx="2" fill="#E3E8EF"/>
    <rect x="50" y="60" width="20" height="20" rx="2" fill="#E3E8EF"/>
  </g>
  <!-- Report -->
  <g transform="translate(380, 220)">
    <rect x="0" y="0" width="120" height="90" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="10" y="10" width="100" height="12" rx="2" fill="#E3E8EF"/>
    <rect x="10" y="30" width="80" height="10" rx="2" fill="#E3E8EF"/>
    <rect x="10" y="50" width="60" height="10" rx="2" fill="#E3E8EF"/>
    <rect x="10" y="70" width="100" height="12" rx="2" fill="#E3E8EF"/>
  </g>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Data Processing &amp; Digital Office Skills</text>
</svg>
