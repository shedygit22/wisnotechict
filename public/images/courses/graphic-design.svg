<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="gdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0A1930"/>
    </linearGradient>
    <filter id="gdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="350" fill="#FFFFFF"/>
  <rect x="0" y="0" width="600" height="350" rx="12" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1"/>
  <!-- Design canvas -->
  <g transform="translate(100, 40)" filter="url(#gdShadow)">
    <rect x="0" y="0" width="400" height="250" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
    <!-- Logo mark -->
    <rect x="160" y="60" width="80" height="80" rx="12" fill="#102A56"/>
    <rect x="180" y="80" width="40" height="40" rx="4" fill="#FFFFFF"/>
    <rect x="190" y="100" width="20" height="20" fill="#FFFFFF"/>
    <!-- Color swatches -->
    <rect x="40" y="200" width="32" height="32" rx="4" fill="#EF4444"/>
    <rect x="80" y="200" width="32" height="32" rx="4" fill="#F59E0B"/>
    <rect x="120" y="200" width="32" height="32" rx="4" fill="#10B981"/>
    <rect x="160" y="200" width="32" height="32" rx="4" fill="#3B82F6"/>
    <rect x="200" y="200" width="32" height="32" rx="4" fill="#8B5CF6"/>
    <!-- Text on canvas -->
    <text x="200" y="310" font-family="Arial" font-size="20" fill="#0A1930" text-anchor="middle" font-weight="bold">BRAND</text>
    <text x="200" y="335" font-family="Arial" font-size="13" fill="#64748B" text-anchor="middle">Visual Identity</text>
  </g>
  <!-- Design tools -->
  <g transform="translate(520, 40)">
    <rect x="0" y="0" width="60" height="60" rx="6" fill="#102A56" opacity="0.1" stroke="#102A56" stroke-width="1"/>
    <circle cx="30" cy="30" r="12" fill="#102A56"/>
    <rect x="24" y="18" width="12" height="24" rx="2" fill="#FFFFFF"/>
  </g>
  <g transform="translate(520, 120)">
    <rect x="0" y="0" width="60" height="60" rx="6" fill="#102A56" opacity="0.1" stroke="#102A56" stroke-width="1"/>
    <path d="M10 50 L30 10 L50 50 Z" fill="#102A56" opacity="0.8"/>
  </g>
  <g transform="translate(520, 200)">
    <rect x="0" y="0" width="60" height="60" rx="6" fill="#102A56" opacity="0.1" stroke="#102A56" stroke-width="1"/>
    <path d="M10 10 L50 10 L30 50 Z" fill="#102A56" opacity="0.8"/>
  </g>
  <!-- Palette -->
  <g transform="translate(380, 270)">
    <rect x="0" y="0" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#E3E8EF"/>
    <rect x="4" y="4" width="12" height="12" rx="2" fill="#EF4444"/>
    <rect x="24" y="4" width="12" height="12" rx="2" fill="#F59E0B"/>
    <rect x="4" y="24" width="12" height="12" rx="2" fill="#10B981"/>
    <rect x="24" y="24" width="12" height="12" rx="2" fill="#3B82F6"/>
  </g>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Graphic Design &amp; Visual Communication</text>
</svg>
