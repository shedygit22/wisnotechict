<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="sdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0A1930"/>
    </linearGradient>
    <filter id="sdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="350" fill="#FFFFFF"/>
  <rect x="0" y="0" width="600" height="350" rx="12" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1"/>
  <!-- Code editor -->
  <g transform="translate(60, 40)" filter="url(#sdShadow)">
    <rect x="0" y="0" width="480" height="240" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
    <rect x="0" y="0" width="480" height="32" rx="8" fill="#102A56"/>
    <rect x="16" y="8" width="12" height="12" rx="2" fill="#EF4444"/>
    <rect x="34" y="8" width="12" height="12" rx="2" fill="#F59E0B"/>
    <rect x="52" y="8" width="12" height="12" rx="2" fill="#10B981"/>
    <!-- Code lines -->
    <text x="24" y="48" font-family="monospace" font-size="12" fill="#344054">const app = require('express')();</text>
    <text x="24" y="64" font-family="monospace" font-size="12" fill="#344054">app.get('/', (req, res) => {</text>
    <text x="40" y="80" font-family="monospace" font-size="12" fill="#102A56">  res.send('Wisnotech');</text>
    <text x="24" y="96" font-family="monospace" font-size="12" fill="#344054">});</text>
    <text x="24" y="112" font-family="monospace" font-size="12" fill="#344054">app.listen(3000);</text>
    <text x="24" y="128" font-family="monospace" font-size="12" fill="#344054">console.log('Server running');</text>
    <rect x="24" y="144" width="200" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="24" y="160" width="150" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="24" y="176" width="220" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="24" y="192" width="100" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="24" y="208" width="180" height="8" rx="2" fill="#E3E8EF"/>
    <rect x="24" y="224" width="240" height="8" rx="2" fill="#E3E8EF"/>
  </g>
  <!-- Server / database -->
  <g transform="translate(460, 60)">
    <rect x="0" y="0" width="80" height="100" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="10" y="10" width="60" height="12" rx="2" fill="#102A56" opacity="0.15"/>
    <rect x="10" y="28" width="60" height="12" rx="2" fill="#102A56" opacity="0.15"/>
    <rect x="10" y="46" width="60" height="12" rx="2" fill="#102A56" opacity="0.15"/>
    <rect x="10" y="64" width="60" height="12" rx="2" fill="#102A56" opacity="0.15"/>
    <rect x="10" y="82" width="60" height="12" rx="2" fill="#102A56" opacity="0.15"/>
  </g>
  <!-- Git branch -->
  <g transform="translate(460, 180)">
    <rect x="0" y="0" width="80" height="100" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <circle cx="20" cy="30" r="8" fill="#102A56" opacity="0.2"/>
    <circle cx="50" cy="30" r="8" fill="#102A56" opacity="0.2"/>
    <circle cx="35" cy="60" r="8" fill="#102A56" opacity="0.2"/>
    <path d="M20 38 L35 52 L50 38" stroke="#102A56" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Cloud -->
  <g transform="translate(460, 280)">
    <rect x="0" y="0" width="80" height="40" rx="10" fill="#102A56" opacity="0.1" stroke="#102A56" stroke-width="1"/>
    <circle cx="20" cy="20" r="12" fill="#102A56" opacity="0.2"/>
    <circle cx="40" cy="16" r="14" fill="#102A56" opacity="0.2"/>
    <circle cx="60" cy="20" r="12" fill="#102A56" opacity="0.2"/>
  </g>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Software Development &amp; Engineering</text>
</svg>
