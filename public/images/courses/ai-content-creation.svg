<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0A1930"/>
    </linearGradient>
    <filter id="aiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="350" fill="#FFFFFF"/>
  <rect x="0" y="0" width="600" height="350" rx="12" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1"/>
  <!-- AI brain / robot head -->
  <g transform="translate(220, 50)" filter="url(#aiShadow)">
    <rect x="0" y="0" width="160" height="200" rx="20" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
    <!-- Head -->
    <circle cx="80" cy="70" r="44" fill="#102A56"/>
    <circle cx="80" cy="70" r="30" fill="#0A1930"/>
    <!-- Eyes -->
    <circle cx="62" cy="64" r="6" fill="#FFFFFF"/>
    <circle cx="98" cy="64" r="6" fill="#FFFFFF"/>
    <!-- Antenna -->
    <line x1="80" y1="30" x2="80" y2="50" stroke="#102A56" stroke-width="3"/>
    <circle cx="80" cy="26" r="4" fill="#102A56"/>
    <!-- Circuit lines -->
    <path d="M40 100 L40 130 L70 130 L70 160 L110 160 L110 130 L140 130 L140 100" stroke="#102A56" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="100" r="3" fill="#102A56"/>
    <circle cx="70" cy="130" r="3" fill="#102A56"/>
    <circle cx="110" cy="160" r="3" fill="#102A56"/>
    <circle cx="140" cy="130" r="3" fill="#102A56"/>
    <!-- Output -->
    <rect x="50" y="180" width="60" height="14" rx="2" fill="#102A56" opacity="0.2"/>
    <rect x="50" y="180" width="40" height="14" rx="2" fill="#102A56"/>
  </g>
  <!-- Content icons -->
  <g transform="translate(420, 60)">
    <rect x="0" y="0" width="100" height="100" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <rect x="20" y="20" width="60" height="14" rx="2" fill="#102A56" opacity="0.15"/>
    <rect x="20" y="42" width="40" height="14" rx="2" fill="#102A56" opacity="0.15"/>
    <rect x="20" y="64" width="30" height="14" rx="2" fill="#102A56" opacity="0.15"/>
    <circle cx="30" cy="90" r="10" fill="#102A56" opacity="0.15"/>
  </g>
  <g transform="translate(420, 180)">
    <rect x="0" y="0" width="100" height="100" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
    <circle cx="50" cy="40" r="20" fill="#102A56" opacity="0.1"/>
    <path d="M30 20 L50 40 L70 20 Z" fill="#102A56" opacity="0.4"/>
    <rect x="40" y="60" width="20" height="20" rx="4" fill="#102A56" opacity="0.3"/>
  </g>
  <!-- Sparkles -->
  <path d="M100 260 L110 260 L105 255 L105 265 Z" fill="#102A56" opacity="0.3"/>
  <path d="M130 250 L140 250 L135 245 L135 255 Z" fill="#102A56" opacity="0.3"/>
  <path d="M70 270 L80 270 L75 265 L75 275 Z" fill="#102A56" opacity="0.3"/>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">AI Content Creation &amp; Generative AI</text>
</svg>
