<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="uxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#0A1930"/>
    </linearGradient>
    <filter id="uxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="350" fill="#FFFFFF"/>
  <rect x="0" y="0" width="600" height="350" rx="12" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1"/>
  <!-- Mobile app wireframe -->
  <g transform="translate(130, 40)" filter="url(#uxShadow)">
    <rect x="0" y="0" width="180" height="270" rx="20" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
    <!-- Status bar -->
    <rect x="40" y="20" width="100" height="10" rx="2" fill="#E3E8EF"/>
    <rect x="150" y="20" width="10" height="10" rx="2" fill="#102A56"/>
    <!-- App content -->
    <rect x="30" y="50" width="120" height="40" rx="6" fill="#102A56" opacity="0.1"/>
    <circle cx="60" cy="70" r="14" fill="#102A56" opacity="0.2"/>
    <rect x="30" y="100" width="60" height="14" rx="2" fill="#E3E8EF"/>
    <rect x="100" y="100" width="50" height="14" rx="2" fill="#E3E8EF"/>
    <rect x="30" y="124" width="100" height="14" rx="2" fill="#E3E8EF"/>
    <rect x="30" y="148" width="70" height="14" rx="2" fill="#E3E8EF"/>
    <!-- Profile -->
    <circle cx="50" cy="200" r="24" fill="#E3E8EF"/>
    <rect x="26" y="234" width="48" height="14" rx="2" fill="#E3E8EF"/>
    <rect x="30" y="258" width="40" height="10" rx="2" fill="#E3E8EF"/>
    <!-- Button -->
    <rect x="30" y="284" width="120" height="40" rx="10" fill="#102A56"/>
    <text x="90" y="306" font-family="Arial" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Get Started</text>
  </g>
  <!-- User personas -->
  <g transform="translate(340, 40)">
    <circle cx="30" cy="30" r="24" fill="#FFFFFF" stroke="#102A56" stroke-width="2"/>
    <rect x="18" y="60" width="24" height="40" rx="4" fill="#102A56" opacity="0.1"/>
    <circle cx="30" cy="110" r="24" fill="#FFFFFF" stroke="#102A56" stroke-width="2"/>
    <rect x="18" y="140" width="24" height="40" rx="4" fill="#102A56" opacity="0.1"/>
    <circle cx="30" cy="190" r="24" fill="#FFFFFF" stroke="#102A56" stroke-width="2"/>
    <rect x="18" y="220" width="24" height="40" rx="4" fill="#102A56" opacity="0.1"/>
  </g>
  <!-- Arrows/flow -->
  <path d="M320 135 L340 155 L360 135" stroke="#102A56" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M340 155 L340 190" stroke="#102A56" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">UI/UX Design &amp; Prototyping</text>
</svg>
